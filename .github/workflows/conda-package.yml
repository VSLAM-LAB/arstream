# Builds the arstream (python/) and libarstream (cpp/) conda packages (linux-64, osx-arm64, win-64) on every push
# to main, and publishes them to https://prefix.dev/vslamlab/vslamlab when a version tag (vX.Y.Z) is pushed.
# Publishing uses prefix.dev trusted publishing (OIDC): prefix.dev > Settings > Repository Access > GitHub,
# repository VSLAM-LAB/arstream, workflow conda-package.yml, read/write on vslamlab/vslamlab. No API key is stored.
#
# Release: bump `version` in python/pixi.toml, python/pyproject.toml and cpp/pixi.toml (all three the same), push
# to main, then `git tag vX.Y.Z && git push origin vX.Y.Z`.
name: conda-package

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-64 }
          - { os: macos-latest, platform: osx-arm64 }
          - { os: windows-latest, platform: win-64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.81.0
          run-install: false

      - name: Check tag matches the package versions
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        run: |
          python3 - <<'EOF'
          import os, sys, tomllib
          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          versions = {path: tomllib.load(open(path, 'rb'))[table]['version']
                      for path, table in (('python/pixi.toml', 'package'), ('cpp/pixi.toml', 'package'),
                                          ('python/pyproject.toml', 'project'))}
          bad = {path: v for path, v in versions.items() if v != tag}
          if bad:
              sys.exit(f'tag v{tag} does not match {bad}')
          print(f'version {tag} OK')
          EOF

      - name: Build the packages into a local channel
        run: |
          pixi build --clean --path python --output-dir channel/${{ matrix.platform }}
          pixi build --clean --path cpp --output-dir channel/${{ matrix.platform }}
          pixi exec -c https://prefix.dev/conda-forge -s rattler-index -- rattler-index fs channel

      # Fresh environments from the local channel: the command is packaged and the header compiles
      - name: Test
        run: |
          pixi exec -c "${{ github.workspace }}/channel" -c https://prefix.dev/conda-forge -s arstream -- arstream --help
          pixi exec -c "${{ github.workspace }}/channel" -c https://prefix.dev/conda-forge -s libarstream -- arstream_subscribe --help

      - uses: actions/upload-artifact@v7
        with:
          name: arstream-${{ matrix.platform }}
          path: channel/${{ matrix.platform }}/*.conda
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # trusted publishing to prefix.dev
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: arstream-*
          merge-multiple: true
          path: packages

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.81.0
          run-install: false

      # --skip-existing: a re-run after a partial upload never overwrites a published file
      - name: Upload to prefix.dev
        run: |
          ls -l packages
          [ "$(ls packages/*.conda | wc -l)" -eq 6 ] || { echo "expected 6 packages (2 x 3 platforms)"; exit 1; }
          pixi exec rattler-build upload prefix --skip-existing --channel vslamlab/vslamlab packages/*.conda
